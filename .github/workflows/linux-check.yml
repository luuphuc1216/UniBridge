
name: linux-check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unibridge_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/unibridge_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unibridge_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unibridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unibridge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Phiên bản công cụ
        run: |
          node -v
          npm -v
          gcc --version | head -1
          python3 --version

      - name: Cài đặt đầy đủ
        run: npm ci

      - name: Kiểm tra install-scripts
        run: npm install-scripts ls

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Create isolated test database
        run: |
          if ! psql --host localhost --username postgres --dbname unibridge_ci --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'unibridge_test'" | grep --quiet '^1$'; then
            createdb --host localhost --username postgres --maintenance-db unibridge_ci unibridge_test
          fi
        env:
          PGPASSWORD: postgres

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unibridge_test?schema=public

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
